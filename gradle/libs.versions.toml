[versions]
agp = "9.4.1"
kotlin = "2.4.20"
hotwire = "1.3.1"
bridgeComponents = "v0.14.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
androidxActivity = "1.13.0"
androidxAppcompat = "1.8.0"
androidxBrowser = "1.10.0"
androidxConstraintlayout = "2.2.2"
androidxCore = "1.19.1"
androidxFragment = "1.9.1"
androidxLifecycle = "2.11.0"
androidxSplashscreen = "1.2.0"
androidxWebkit = "1.17.1"
material = "1.14.0"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
spotless = "8.10.3"
ktlint = "1.8.0"
junit = "4.13.2"
truth = "1.4.5"
gson = "2.14.0"

[libraries]
hotwire-core = { module = "dev.hotwire:core", version.ref = "hotwire" }
hotwire-navigation-fragments = { module = "dev.hotwire:navigation-fragments", version.ref = "hotwire" }
bridge-components = { module = "com.github.joemasilotti:bridge-components", version.ref = "bridgeComponents" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
androidx-activity = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidxAppcompat" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-fragment = { module = "androidx.fragment:fragment-ktx", version.ref = "androidxFragment" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidxSplashscreen" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidxWebkit" }
material = { module = "com.google.android.material:material", version.ref = "material" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
