name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and checks the wrapper jar against Gradle's checksums.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests, lint, formatting
        run: ./gradlew testDebugUnitTest lintDebug spotlessCheck

      # No signing secrets here: release builds come out unsigned and staging
      # builds debug-signed, which is enough to know they build and shrink.
      - name: Build every variant
        run: ./gradlew assembleDebug assembleStaging assembleRelease

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

      - name: Keep the APKs
        uses: actions/upload-artifact@v7
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
